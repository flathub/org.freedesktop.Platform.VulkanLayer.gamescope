id: org.freedesktop.Platform.VulkanLayer.gamescope
branch: '24.08'
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
build-extension: true
separate-locales: false

build-options:
  cflags: -I/usr/lib/extensions/vulkan/gamescope/include
  cxxflags: -I/usr/lib/extensions/vulkan/gamescope/include
  ldflags: -L/usr/lib/extensions/vulkan/gamescope/lib
  prefix: /usr/lib/extensions/vulkan/gamescope
  libdir: /usr/lib/extensions/vulkan/gamescope/lib
  prepend-path: /usr/lib/extensions/vulkan/gamescope/bin
  prepend-ld-library-path: /usr/lib/extensions/vulkan/gamescope/lib
  prepend-pkg-config-path: /usr/lib/extensions/vulkan/gamescope/lib/pkgconfig

modules:
  - name: hwdata
    config-opts:
      - --datarootdir=${FLATPAK_DEST}/share
    sources:
      - type: archive
        url: https://github.com/vcrhonek/hwdata/archive/v0.404/hwdata-0.404.tar.gz
        sha256: 5c14fc99bf193faad1ccc267ccfff14ee4e4550a582b17a76aec72178539f837
        x-checker-data:
          type: anitya
          project-id: 5387
          stable-only: true
          url-template: https://github.com/vcrhonek/hwdata/archive/v$version/hwdata-$version.tar.gz
    post-install:
      - mkdir -p -m 755 ${FLATPAK_DEST}/lib/pkgconfig
      - install -m 644 ${FLATPAK_DEST}/share/pkgconfig/hwdata.pc ${FLATPAK_DEST}/lib/pkgconfig/
    cleanup:
      - /lib/pkgconfig
      - /lib/modprobe.d
      - /share/aclocal
      - /share/pkgconfig

  - modules/libevdev.yml
  - modules/libinput.yml
  - modules/libseat.yml
  - modules/xwayland.yml
  - modules/libei.yml
  - shared-modules/luajit/luajit.json

  - name: gamescope
    buildsystem: meson
    config-opts:
      - -Dpipewire=enabled
      - -Dforce_fallback_for=stb,wlroots,libliftoff,vkroots
    sources:
      - type: git
        url: https://github.com/ValveSoftware/gamescope.git
        commit: 0b445d97dbfea5cd89e644b44627b907ffd1ac35
        tag: 3.16.20
        x-checker-data:
          type: git
          tag-pattern: ^([\d.]+)$
          is-main-source: true

      # Keep stb tracking https://github.com/ValveSoftware/gamescope/blob/master/subprojects/stb.wrap
      - type: archive
        url: https://github.com/nothings/stb/archive/5736b15f7ea0ffb08dd38af21067c314d6a3aae9/stb.tar.gz
        sha256: d00921d49b06af62aa6bfb97c1b136bec661dd11dd4eecbcb0da1f6da7cedb4c
        dest: subprojects/stb
        # Tracking based on may cause spurious MR before gamescope release
        x-checker-data:
          type: html
          url: https://raw.githubusercontent.com/ValveSoftware/gamescope/refs/heads/master/subprojects/stb.wrap
          version-pattern: revision\s*=\s*([a-f0-9]+)
          url-template: https://github.com/nothings/stb/archive/$version/stb.tar.gz

      # Keep glm tracking https://github.com/ValveSoftware/gamescope/blob/master/subprojects/glm.wrap
      - type: archive
        url: https://github.com/g-truc/glm/archive/0af55ccecd98d4e5a8d1fad7de25ba429d60e863/glm.tar.gz
        sha256: e7f187d83523f505eb38dd25d297ea6c0d4ed856d733e808f18253f5a8fa88a0
        dest: subprojects/glm
        x-checker-data:
          type: html
          url: https://raw.githubusercontent.com/ValveSoftware/gamescope/refs/heads/master/subprojects/glm.wrap
          version-pattern: revision\s*=\s*([a-f0-9]+)
          url-template: https://github.com/g-truc/glm/archive/$version/glm.tar.gz

      # v4l-utils is a dependency of libdisplay-info tests

      - type: shell
        commands:
          # Abort build if gamescope wrap file change
          - echo -n 'Checking stb version ' && grep 5736b15f7ea0ffb08dd38af21067c314d6a3aae9
            subprojects/stb.wrap
          - echo -n 'Checking glm version ' && grep 0af55ccecd98d4e5a8d1fad7de25ba429d60e863
            subprojects/glm.wrap
          # As we download subprojects outside of meson we must apply gamescopes packagefiles (add meson.build to them)
          - meson subprojects packagefiles --apply

    cleanup:
      - /include
      - /lib/pkgconfig
      - /lib/*.a
      - /share/pkgconfig
      - /share/applications
      - /bin/di-edid-decode
    post-install:
      - mv ${FLATPAK_DEST}/bin/gamescope ${FLATPAK_DEST}/bin/gamescope-brokey
    modules:
      - name: xmu
        sources:
          - type: archive
            url: https://www.x.org/archive/individual/lib/libXmu-1.3.1.tar.xz
            sha256: 81a99e94c4501e81c427cbaa4a11748b584933e94b7a156830c3621256857bc4
            x-checker-data:
              type: anitya
              project-id: 1785
              url-template: https://www.x.org/archive/individual/lib/libXmu-$version.tar.xz
        cleanup:
          - /include
          - /lib/*.la
          - /lib/*.a
          - /share
          - /lib/pkgconfig

      # Used to build gamescope benchwarks
      - name: google-benchmark
        disabled: true
        buildsystem: cmake-ninja
        config-opts:
          - -DBENCHMARK_ENABLE_GTEST_TESTS=OFF
          - -DBENCHMARK_USE_BUNDLED_GTEST=OFF
          - -DCMAKE_CXX_FLAGS=
        sources:
          - type: archive
            url: https://github.com/google/benchmark/archive/v1.9.5/google-benchmark-1.9.5.tar.gz
            sha256: 9631341c82bac4a288bef951f8b26b41f69021794184ece969f8473977eaa340
            x-checker-data:
              type: anitya
              project-id: 18299
              url-template: https://github.com/google/benchmark/archive/v$version/google-benchmark-$version.tar.gz
        cleanup:
          - /include
          - /lib/*.a
          - /share
          - /lib/cmake
          - /lib/pkgconfig

  - name: metadata
    buildsystem: simple
    build-commands:
      - install -Dm755 gamescope /usr/lib/extensions/vulkan/gamescope/bin
      - install -DCm644 ${FLATPAK_ID}.metainfo.xml -t ${FLATPAK_DEST}/share/metainfo
        ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        path: org.freedesktop.Platform.VulkanLayer.gamescope.metainfo.xml

      - type: script
        dest-filename: gamescope
        commands:
          - |
            #!/usr/bin/env bash
            LD_LIBRARY_PATH=/usr/lib/extensions/vulkan/gamescope/lib:$LD_LIBRARY_PATH
            PATH=/usr/lib/extensions/vulkan/gamescope/bin:$PATH:/usr/lib/extensions/vulkan/MangoHud/bin

            exec gamescope-brokey "$@"
